<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LøpNorge – Løpekalender 2026</title>

  <meta name="description" content="LøpNorge – finn ditt neste løp i Vestland. Filtrer på dato, type, distanse og søk etter sted eller løpsnavn." />
  <meta name="theme-color" content="#2563eb" />

  <!-- Premium font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>

<body>
  <a href="#main" class="skip-link">Hopp til innhold</a>

  <header>
    <div class="container">
      <div class="brand">
        <img class="logo" src="logo.png" alt="LøpNorge logo" />
        <h1 class="tagline">Finn ditt neste løp</h1>
      </div>

      <form class="filters" aria-label="Filtre" onsubmit="return false;">
        <label for="fromDate">
          Fra dato
          <input id="fromDate" type="date" />
        </label>

        <label for="toDate">
          Til dato
          <input id="toDate" type="date" />
        </label>

        <label for="type">
          Type
          <select id="type">
            <option value="">Alle</option>
            <option value="Landevei">Landevei</option>
            <option value="Terreng">Terreng</option>
            <option value="Trail">Trail</option>
            <option value="Bane">Bane</option>
            <option value="Motbakke">Motbakke</option>
            <option value="Bane/vei">Bane/vei</option>
          </select>
        </label>

        <label for="maxKm">
          Maks distanse (km)
          <input id="maxKm" type="number" min="0" step="0.1" placeholder="f.eks. 10" inputmode="decimal" />
        </label>

        <label for="q">
          Søk
          <input id="q" type="search" placeholder="Bergen, maraton, Os..." autocomplete="off" />
        </label>

        <button id="reset" class="btn-danger" type="button" aria-label="Nullstill alle filtre">
          Nullstill
        </button>
      </form>
    </div>
  </header>

  <main id="main" class="container">
    <div class="meta">
      <span id="count" aria-live="polite">Laster…</span>
      <span class="spacer"></span>

      <label for="sort">
        Sortering
        <select id="sort">
          <option value="featured">Populære først</option>
          <option value="date">Dato</option>
          <option value="distance">Distanse</option>
          <option value="name">Navn</option>
        </select>
      </label>
    </div>

    <div id="list" class="list" aria-label="Løpsliste"></div>
  </main>
</body>
</html>
